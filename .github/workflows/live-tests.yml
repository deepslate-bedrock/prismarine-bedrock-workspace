name: Live Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test. Defaults to the workflow branch.
        required: false
        type: string
      target:
        description: Managed server target to launch.
        required: false
        default: endstone
        type: choice
        options:
          - endstone
          - java
      world:
        description: Managed server world type.
        required: false
        default: superflat
        type: choice
        options:
          - superflat
          - normal
      mc-version:
        description: Bedrock protocol/data version.
        required: false
        default: "1.26.10"
        type: string
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: live-tests-${{ github.event_name == 'issue_comment' && github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-comment-ref:
    name: Resolve PR comment ref
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/test-live')
    runs-on: ubuntu-latest
    outputs:
      head-sha: ${{ steps.pr.outputs.head-sha }}
    steps:
      - name: Resolve pull request head
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const pull_number = context.payload.issue.number
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number })
            core.setOutput('head-sha', pull.head.sha)

  live:
    name: Live tests
    if: always() && (github.event_name == 'workflow_dispatch' || needs.resolve-comment-ref.result == 'success')
    needs:
      - resolve-comment-ref
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || needs.resolve-comment-ref.outputs.head-sha || github.ref }}
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-24-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'repos/prismarine-bedrock/package.json', 'repos/prismarine-bedrock-ai/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-24-pnpm-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            repos/prismarine-bedrock/node_modules
            repos/prismarine-bedrock-ai/node_modules
          key: ${{ runner.os }}-node-24-node-modules-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'repos/prismarine-bedrock/package.json', 'repos/prismarine-bedrock-ai/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-24-node-modules-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native bindings if needed
        shell: bash
        run: |
          if find node_modules repos -path '*raknet-native*node-raknet.node' -print -quit | grep -q .; then
            echo "raknet-native binding already exists."
          else
            pnpm rebuild raknet-native
          fi

          if find node_modules repos -path '*better-sqlite3*better_sqlite3.node' -print -quit | grep -q .; then
            echo "better-sqlite3 binding already exists."
          else
            pnpm rebuild better-sqlite3
          fi

      - name: Launch server and run live tests
        env:
          MC_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs['mc-version'] || vars['LIVE_TEST_MC_VERSION'] || '1.26.10' }}
        run: >
          node repos/prismarine-bedrock-ai/scripts/e2e-servers.js launch
          --target=${{ github.event_name == 'workflow_dispatch' && inputs.target || vars['LIVE_TEST_TARGET'] || 'endstone' }}
          --world=${{ github.event_name == 'workflow_dispatch' && inputs.world || vars['LIVE_TEST_WORLD'] || 'superflat' }}
          --exit-after-client
          --client-timeout-ms=900000
          --client pnpm --dir repos/prismarine-bedrock run test:live
